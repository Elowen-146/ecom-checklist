<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eceef2">
<title>PDF 预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
background:#eceef2;min-height:100vh}
.bar{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;align-items:center;gap:10px;
padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(255,255,255,.97);
box-shadow:0 1px 4px rgba(30,40,60,.09)}
.bk{flex:0 0 30px;height:30px;border-radius:8px;background:#f0f2f6;color:#4a5468;font-size:20px;
line-height:29px;text-align:center;cursor:pointer;user-select:none}
.bk:active{background:#e2e6ee}
.ti{flex:1;font-size:14.5px;font-weight:600;color:#1c2333;min-width:0;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{flex:0 0 auto;background:#1a6fe8;color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;
padding:7px 11px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 3px rgba(26,111,232,.35)}
.dl:active{background:#0a4d8c}
#pv{padding:calc(60px + env(safe-area-inset-top)) 10px 30px}
.pg{background:#fff;margin:0 auto 12px;border-radius:4px;overflow:hidden;
box-shadow:0 1px 4px rgba(30,40,60,.10);width:100%;max-width:820px}
.pg canvas{display:block;width:100%;height:auto}
.msg{text-align:center;color:#8a919f;font-size:13.5px;padding:46px 18px;line-height:2;max-width:560px;margin:0 auto}
.msg a{color:#1a6fe8;font-weight:600;word-break:break-all}
.spin{margin:60px auto 0;width:30px;height:30px;border-radius:50%;
border:3px solid #d7dce5;border-top-color:#1a6fe8;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div class="bar">
  <span class="bk" id="bk">&#8249;</span>
  <span class="ti" id="ti">加载中…</span>
  <a class="dl" id="dl" href="javascript:void(0)">&#11015; Word</a>
</div>
<div id="pv"><div class="spin"></div></div>
<div class="msg" id="msg" style="display:none"></div>
<script src="pdf.min.js"></script>
<script>
function qp(k){
  var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}
var f = qp('f'), w = qp('w'), t = qp('t');
var ti = document.getElementById('ti'), dl = document.getElementById('dl'),
    msg = document.getElementById('msg'), pv = document.getElementById('pv');
if (t) { document.title = t; ti.textContent = t; }
if (w) { dl.setAttribute('href', w); } else { dl.style.display = 'none'; }
document.getElementById('bk').onclick = function () {
  if (history.length > 1) history.back(); else location.href = 'index.html';
};
function fail(e){
  pv.innerHTML = ''; msg.style.display = 'block';
  var d = (e && (e.message || e.reason && e.reason.message)) ? String(e.message || e.reason.message) : '';
  msg.innerHTML = 'PDF 加载失败，请点 <a href="' + encodeURI(f) + '">直接打开 PDF</a>' +
    (d ? '<br><small style="color:#b3bac6">' + d.slice(0, 120) + '</small>' : '');
}
window.onerror = function(m){ try { fail(new Error(String(m))); } catch(_){} };
if (!f || !window.pdfjsLib) { fail(); } else {
pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
pdfjsLib.getDocument({ url: encodeURI(f) }).promise.then(function (pdf) {
  pv.innerHTML = '';
  var pages = [], rendered = {};
  for (var i = 1; i <= pdf.numPages; i++) {
    var box = document.createElement('div');
    box.className = 'pg'; box.setAttribute('data-p', i);
    box.style.aspectRatio = '595/842';
    pv.appendChild(box); pages.push(box);
  }
  function render(i){
    if (rendered[i]) return; rendered[i] = 1;
    var box = pages[i-1];
    pdf.getPage(i).then(function (page) {
      var vp0 = page.getViewport({ scale: 1 });
      var cw = Math.min(box.clientWidth || (document.documentElement.clientWidth - 20), 820) || 750;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var scale = cw / vp0.width;
      var vp = page.getViewport({ scale: scale * dpr });
      var c = document.createElement('canvas');
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      box.style.aspectRatio = 'auto';
      box.appendChild(c);
      page.render({ canvasContext: c.getContext('2d'), viewport: vp });
    }).catch(function(e){ box.textContent = '第' + i + '页渲染失败'; });
  }
  if (window.IntersectionObserver) {
    var io = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) {
        if (en.isIntersecting) {
          render(+en.target.getAttribute('data-p'));
          io.unobserve(en.target);
        }
      });
    }, { rootMargin: '700px 0px' });
    pages.forEach(function (b) { io.observe(b); });
  } else {
    for (var j = 1; j <= pdf.numPages; j++) render(j);
  }
}).catch(fail);
}
</script>
</body></html>
