<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=2">
<meta name="theme-color" content="#1a6fe8">
<title>查检表查看</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
background:#e9ebee;color:#1c2333;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:#1a6fe8;color:#fff;
padding:11px 12px;padding-top:calc(11px + env(safe-area-inset-top));box-shadow:0 1px 6px rgba(0,0,0,.18);z-index:5}
.back{flex:0 0 auto;font-size:22px;line-height:1;width:30px;cursor:pointer;user-select:none}
.ttl{flex:1;font-size:15.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btns{flex:0 0 auto;display:flex;gap:7px}
.b{flex:0 0 auto;font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);
border:1px solid rgba(255,255,255,.55);padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.b:active{background:rgba(255,255,255,.34)}
.b.hide{display:none}
.scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 30px}
.wrap{max-width:760px;margin:0 auto}
.wrap img{display:block;width:100%;height:auto;background:#fff;border-radius:6px;
box-shadow:0 1px 4px rgba(0,0,0,.12);margin-bottom:10px}
.loading{flex:1;display:flex;align-items:center;justify-content:center;color:#8a919f;font-size:14px}
.sp{width:26px;height:26px;border:3px solid #c3c9d4;border-top-color:#1a6fe8;border-radius:50%;
animation:spin .8s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{display:none;text-align:center;color:#5a6474;font-size:14px;padding:30px 16px;line-height:1.9}
.err a{color:#1a6fe8;text-decoration:underline}
</style></head>
<body>
<div class="bar">
  <span class="back" id="back">‹</span>
  <span class="ttl" id="title">查检表</span>
  <span class="btns">
    <span class="b" id="pdfBtn">PDF版</span>
    <span class="b hide" id="wordBtn">⬇ Word</span>
  </span>
</div>
<div class="loading" id="loading"><span class="sp"></span>正在加载…</div>
<div class="scroller" id="scroller" style="display:none"><div class="wrap" id="wrap"></div></div>
<div class="err" id="err"></div>
<script>
(function(){
  function g(k){return decodeURIComponent((location.search.match(RegExp('[?&]'+k+'=([^&]*)'))||[])[1]||'');}
  var imgBase=g('i'), pdfUrl=g('p'), wordUrl=g('w'), title=g('t'), pg=parseInt(g('pg')||'1',10)||1;
  document.getElementById('title').textContent = title || '查检表';
  document.title = (title||'查检表');
  var pdfBtn=document.getElementById('pdfBtn'), wordBtn=document.getElementById('wordBtn');
  pdfBtn.onclick=function(){ if(pdfUrl) location.href=pdfUrl; };
  if(wordUrl){ wordBtn.classList.remove('hide'); wordBtn.onclick=function(){ location.href=wordUrl; }; }
  document.getElementById('back').onclick=function(){
    if(history.length>1) history.back(); else location.href='index.html';
  };
  var wrap=document.getElementById('wrap'), loading=document.getElementById('loading'),
      errEl=document.getElementById('err'), scroller=document.getElementById('scroller');
  var loaded=0, ok=true;
  function next(i){
    if(i>pg){ done(); return; }
    var im=new Image();
    im.alt='第'+i+'页';
    im.onload=function(){ wrap.appendChild(im); loaded++; next(i+1); };
    im.onerror=function(){ ok=false; done(); };
    im.src=imgBase+'/p'+ (i<10?'0'+i:i) +'.jpg';
  }
  function done(){
    if(loaded===0){
      loading.style.display='none'; scroller.style.display='none';
      errEl.style.display='block';
      errEl.innerHTML='图片加载失败。<br>请点 <a href="'+encodeURI(pdfUrl)+'">直接打开 PDF 版</a>'+
        (wordUrl?' 或 <a href="'+encodeURI(wordUrl)+'">下载 Word 版</a>':'')+'<br>或返回重试。';
    } else {
      loading.style.display='none'; scroller.style.display='block';
    }
  }
  if(pg<1) pg=1;
  next(1);
})();
</script>
</body></html>
