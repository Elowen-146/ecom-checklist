async function render(url){
  try{
    const pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
    // worker 已通过 <script> 引入主线程（globalThis.pdfjsWorker），无需 workerSrc
    const doc = await pdfjsLib.getDocument({url: url}).promise;
    tipEl.textContent = '共 ' + doc.numPages + ' 页，正在渲染…';
    // 逐页渲染：宽度自适应容器，按 devicePixelRatio 保证清晰度
    for (let n = 1; n <= doc.numPages; n++){
      const page = await doc.getPage(n);
      const base = page.getViewport({scale: 1});
      const cssW = Math.min(scrollEl.clientWidth - 16, 884);
      const scale = cssW / base.width;
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const vp = page.getViewport({scale: scale * dpr});
      const wrap = document.createElement('div');
      wrap.className = 'pgwrap';
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      canvas.style.width = Math.floor(base.width * scale) + 'px';
      wrap.appendChild(canvas);
      pagesEl.appendChild(wrap);
      await page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise;
      if (n === 1) tipEl.textContent = doc.numPages + ' 页';
      if (n === doc.numPages){
        tipEl.style.opacity = '0';
        setTimeout(function(){ tipEl.style.display = 'none'; }, 600);
      } else {
        tipEl.textContent = '渲染中 ' + n + ' / ' + doc.numPages + ' 页…';
      }
    }
  }catch(e){
    tipEl.style.display = 'none';
    errEl.style.display = 'block';
    errEl.innerHTML = '加载失败：' + (e && e.message ? e.message : e) +
      '<br><br><a href="' + url + '">点此直接打开 PDF</a>（或点右上角 ⬇ 下载）';
  }
}
