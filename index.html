<style>

  .search{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:10}
  .search input{width:100%;padding:13px 14px;font-size:16px;border:1px solid #d1d5db;border-radius:10px;outline:none;background:#fff}

  .count{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 12px}

  .idx{flex:0 0 34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .name{flex:1;font-size:15px;line-height:1.4;word-break:break-word}
  .badge{font-size:11px;color:#fff;background:#f59e0b;padding:2px 6px;border-radius:6px;margin-left:6px;white-space:nowrap}
  .arrow{flex:0 0 auto;color:var(--muted);font-size:20px}
  .index-card{background:#eef6ff;border-color:#bcdcff}
  .index-card .idx{background:#0a4d8c}
  .empty{text-align:center;color:var(--muted);padding:30px}
  footer{text-align:center;color:var(--muted);font-size:11px;padding:24px 0 0;line-height:1.6}
</style>

const list = document.getElementById('list');
const q = document.getElementById('q');
const countEl = document.getElementById('count');
document.getElementById('total').textContent = DATA.length;
function render(filter){
  const f = (filter || '').trim().toLowerCase();
  list.innerHTML = '';
  let shown = 0;
  DATA.forEach(function(it, i){
    if (f && it.name.toLowerCase().indexOf(f) === -1) return;
    shown++;
    const key = it.file.replace(/^pdfs2?\//,'').replace(/\.pdf$/,'');
    const a = document.createElement('a');
    a.className = 'card' + (it.isIndex ? ' index-card' : '');
    a.href = 'view.html?v=20260926e&f=' + key;
    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = it.isIndex ? '目' : (i + 1);
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = it.name;
    if (it.isIndex){ const b = document.createElement('span'); b.className = 'badge'; b.textContent = '总目录'; name.appendChild(b); }
    const arrow = document.createElement('div');
    arrow.className = 'arrow'; arrow.textContent = '›';
    a.appendChild(idx); a.appendChild(name); a.appendChild(arrow);
    list.appendChild(a);
  });
  if (shown === 0){ const e = document.createElement('div'); e.className = 'empty'; e.textContent = '没有匹配的表单'; list.appendChild(e); }
  countEl.textContent = '显示 ' + shown + ' / ' + DATA.length + ' 份';
}
q.addEventListener('input', function(){ render(q.value); });
